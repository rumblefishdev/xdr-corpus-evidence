name: corpus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq
      - name: Round-trip every corpus file (sha256 + decode/encode byte-exact)
        run: corpus/tools/roundtrip.sh
      - name: Manifest is up to date with the corpus files
        run: python3 -I corpus/tools/build-manifest.py --check
      - name: Validate the schema and the manifest
        run: |
          pipx run --spec check-jsonschema==0.29.4 check-jsonschema --check-metaschema corpus/manifest.schema.json
          pipx run --spec check-jsonschema==0.29.4 check-jsonschema --schemafile corpus/manifest.schema.json corpus/manifest.json

  conformance:
    # every corpus entry through js-stellar-sdk 17.2.0 / 17.2.1 / 17.3.0 / 17.4.0; verdicts must match conformance/expected.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run all corpus entries through three SDK releases (#1766 and #1789 before/after)
        run: conformance/run.sh

  sighting-729:
    # wallet-backend #729 on corpus entry cap0040-signed-payload-signer-01, from a clean checkout:
    # pre-fix = dropped (signer error in the log), fixed = pass. Catches setup bugs that only show on a fresh machine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq postgresql-client
      - name: Reproduce wallet-backend #729 from the committed ledger file
        run: sighting-729/repro.sh --clean --from-corpus
